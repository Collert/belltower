<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Belltower{% endblock %}</title>
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #e2e2e6; --bg: #fafafa; --card: #fff; --accent: #2f5bd3; --danger: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececf0; --muted: #9a9aa2; --line: #33333a; --bg: #16161a; --card: #1f1f24; --accent: #7d9bff; --danger: #ff7b6b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
    header .brand { font-weight: 600; color: inherit; text-decoration: none; margin-right: auto; }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    a { color: var(--accent); }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; }
    ul.plain { list-style: none; padding: 0; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    .row { display: flex; align-items: flex-start; gap: .5rem; padding: .6rem .75rem; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .pad { padding: .25rem 1rem 1rem; margin-bottom: 1rem; }
    .muted { color: var(--muted); font-size: .85em; }
    .done .title { text-decoration: line-through; color: var(--muted); }
    .expired { color: var(--danger); }
    .sub { padding-left: 2.25rem; }
    form.inline { display: inline; margin: 0; }
    form.stack { display: grid; gap: .5rem; margin: 1rem 0; }
    input, textarea, select, button { font: inherit; color: inherit; }
    input[type=text], input[type=password], input[type=datetime-local], textarea, select {
      width: 100%; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    }
    button { padding: .4rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.link { border: 0; background: none; padding: 0 .25rem; color: var(--muted); }
    button.danger { color: var(--danger); }
    .errorlist { color: var(--danger); margin: 0; padding-left: 1rem; }
    code, pre { font-family: ui-monospace, monospace; font-size: .9em; }
    pre { overflow-x: auto; padding: .75rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'index' %}">Belltower</a>
    {% if user.is_authenticated %}
      <a href="{% url 'account' %}">{{ user.get_username }}</a>
      <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Log out</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
