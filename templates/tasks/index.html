{% extends "base.html" %}
{% block content %}
<h1>Lists</h1>
<ul class="plain card">
  {% for list in lists %}
    <li class="row">
      <a class="grow" href="{% url 'list-detail' list.pk %}">{{ list.name }}</a>
      <span class="muted">{{ list.open_count }} open</span>
    </li>
  {% empty %}
    <li class="row muted">No lists yet.</li>
  {% endfor %}
</ul>
<form class="stack" method="post">
  {% csrf_token %}
  {{ form.name.errors }}
  {{ form.name }}
  <button class="primary">Create list</button>
</form>
{% endblock %}
